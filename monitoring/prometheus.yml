# Prometheus scrapes GridPilot's /metrics every 30 s.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API container, when the whole stack runs in Docker.
  - job_name: gridpilot
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # The API running directly on your computer (uvicorn on port 8000), when only
  # Prometheus + Grafana run in Docker. Whichever one is up gets scraped.
  - job_name: gridpilot-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
