services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpilot}
      POSTGRES_DB: ${POSTGRES_DB:-gridpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gridpilot}:${POSTGRES_PASSWORD:-gridpilot}@db:5432/${POSTGRES_DB:-gridpilot}
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models
    depends_on:
      db:
        condition: service_healthy

  ingestor:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.ingest.cli", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gridpilot}:${POSTGRES_PASSWORD:-gridpilot}@db:5432/${POSTGRES_DB:-gridpilot}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler.cli", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gridpilot}:${POSTGRES_PASSWORD:-gridpilot}@db:5432/${POSTGRES_DB:-gridpilot}
    volumes:
      - models:/app/models
    depends_on:
      db:
        condition: service_healthy

  # ---- monitoring (Phase 5) ----
  # Whole stack:            docker compose up --build
  # Only the dashboards,
  # with the API on your PC: docker compose up prometheus grafana   (then run uvicorn as usual)
  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets it reach an API running directly on your computer

  grafana:
    image: grafana/grafana-oss:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # visitors can view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gridpilot.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  models:
  promdata:
  grafanadata:
